# bakedinweston staging: __DOMAIN__ -> container "biw-web".
# Added by scripts/server/setup-staging.sh. To remove: delete this file and run
#   docker exec __PROXY__ nginx -s reload
# The upstream is looked up when a request comes in, so this proxy starts fine even if biw-web is down.

server {
    listen 80;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ { root __ACME_ROOT__; }
    location / { return 301 https://$host$request_uri; }   #BIW_HTTP_LOCATION
}

server {   #BIW_HTTPS_START
    listen 443 ssl;
    http2 on;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;

    client_max_body_size 6m;

    location / {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $biw_upstream http://biw-web:80;
        proxy_pass $biw_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
}
