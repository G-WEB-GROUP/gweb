# nginx config of the "biw-web" container (Docker variant of the staging setup).
# The server's main proxy container (scb-proxy-nginx-1) handles HTTPS and passes requests here.
# Mounted into the container as /etc/nginx/conf.d/biw-web.conf; snippets as /etc/nginx/snippets/.

limit_req_zone $binary_remote_addr zone=biw_contact:1m rate=10r/m;
map $host $biw_robots { default "noindex, nofollow"; }   # staging: keep search engines out

# Real visitor IP comes from the proxy (needed for the form rate limit)
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Real-IP;

# Docker's DNS: lets nginx find the biw-contact container by name at request time
resolver 127.0.0.11 valid=30s ipv6=off;

server {
    listen 80 default_server;
    server_name _;
    absolute_redirect off;   # redirects like /faq.html -> /faq stay on the public https host

    include snippets/bakedinweston-site.inc;
}
