# Test preview before DNS switch: plain HTTP on the server's IP (or a test subdomain).
# Replace TEST_HOST with the server IP, e.g. 203.0.113.10, or with test.example.com.
# Search engines are told not to index it.

# Enable only ONE of the bakedinweston*.conf files at a time (they share these names).
limit_req_zone $binary_remote_addr zone=biw_contact:1m rate=10r/m;
map $host $biw_robots { default "noindex, nofollow"; }

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name TEST_HOST _;

    include snippets/bakedinweston-site.inc;
}
