# Staging on a SHARED server (e.g. the one hosting horpyna.g-web.group):
#   https://bakedinweston.g-web.group  — not indexed by search engines.
# Unlike bakedinweston-test.conf it is NOT the default server, so other sites on the server are unaffected.
#
# 1) DNS: A record  bakedinweston.g-web.group -> server IP   (or CNAME -> horpyna.g-web.group)
# 2) sudo cp deploy/nginx/*.inc /etc/nginx/snippets/
#    sudo cp deploy/nginx/bakedinweston-staging.conf /etc/nginx/sites-available/
#    sudo ln -s /etc/nginx/sites-available/bakedinweston-staging.conf /etc/nginx/sites-enabled/
# 3) First run with the HTTPS server block commented out, get the certificate:
#    sudo certbot certonly --webroot -w /var/www/letsencrypt -d bakedinweston.g-web.group --deploy-hook "systemctl reload nginx"
#    then uncomment it and reload nginx.

limit_req_zone $binary_remote_addr zone=biw_contact:1m rate=10r/m;
map $host $biw_robots { default "noindex, nofollow"; }

server {
    listen 80;
    listen [::]:80;
    server_name bakedinweston.g-web.group;

    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bakedinweston.g-web.group;

    ssl_certificate     /etc/letsencrypt/live/bakedinweston.g-web.group/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bakedinweston.g-web.group/privkey.pem;
    include snippets/bakedinweston-ssl.inc;

    # Optional: password-protect the preview (sudo htpasswd -c /etc/nginx/.htpasswd-biw client)
    # auth_basic "Baked in Weston preview";
    # auth_basic_user_file /etc/nginx/.htpasswd-biw;

    include snippets/bakedinweston-site.inc;
}
