# Production: https://bakedinweston.com  (www and http redirect here, as on GoDaddy: og:url has no www)
# Install: copy to /etc/nginx/sites-available/, symlink into sites-enabled, copy bakedinweston-site.inc
# (and the other *.inc files) to /etc/nginx/snippets/. Certificates: certbot --webroot (README "Server setup").

# Enable only ONE of the bakedinweston*.conf files at a time (they share these names).
limit_req_zone $binary_remote_addr zone=biw_contact:1m rate=10r/m;
map $host $biw_robots { default ""; }

server {
    listen 80;
    listen [::]:80;
    server_name bakedinweston.com www.bakedinweston.com;

    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://bakedinweston.com$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.bakedinweston.com;

    ssl_certificate     /etc/letsencrypt/live/bakedinweston.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bakedinweston.com/privkey.pem;
    include snippets/bakedinweston-ssl.inc;

    return 301 https://bakedinweston.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bakedinweston.com;

    ssl_certificate     /etc/letsencrypt/live/bakedinweston.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bakedinweston.com/privkey.pem;
    include snippets/bakedinweston-ssl.inc;

    # Turn on once HTTPS is confirmed working (browsers remember it for a year)
    # add_header Strict-Transport-Security "max-age=31536000" always;

    include snippets/bakedinweston-site.inc;
}
