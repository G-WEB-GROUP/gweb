# Production over plain HTTP — used only until the HTTPS certificate exists
# (DNS switch, option B in docs/dns-cutover.md). Then switch to bakedinweston.conf.

# Enable only ONE of the bakedinweston*.conf files at a time (they share these names).
limit_req_zone $binary_remote_addr zone=biw_contact:1m rate=10r/m;
map $host $biw_robots { default ""; }

server {
    listen 80;
    listen [::]:80;
    server_name bakedinweston.com www.bakedinweston.com;

    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    include snippets/bakedinweston-site.inc;
}
