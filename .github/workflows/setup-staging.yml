# One-time setup of the staging site on the shared server (run by hand).
# Actions -> "Setup staging server" -> Run workflow.
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   STAGING_HOST      server name or IP (e.g. horpyna.g-web.group)
#   STAGING_USER      SSH user (root or a user with sudo)
#   STAGING_SSH_KEY   private SSH key of that user (the server accepts keys only)
#   STAGING_PASSWORD  (optional) the user's password — only used for sudo when the user is not root
# What it changes on the server: see scripts/server/setup-staging.sh (other sites are not touched).
name: Setup staging server

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HOST: ${{ secrets.STAGING_HOST }}
      USER_NAME: ${{ secrets.STAGING_USER }}
      KEY: ${{ secrets.STAGING_SSH_KEY }}
      SUDO_PASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          for v in HOST USER_NAME KEY; do
            [ -n "${!v}" ] || { echo "::error::Secret missing: STAGING_HOST, STAGING_USER and STAGING_SSH_KEY are required"; exit 1; }
          done

      - name: SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf 'Host *\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n  StrictHostKeyChecking accept-new\n' > ~/.ssh/config
          echo "Key fingerprint (compare with: ssh-keygen -lf ~/.ssh/biw_deploy.pub):"
          ssh-keygen -lf ~/.ssh/id_deploy || { echo "::error::STAGING_SSH_KEY is not a valid private key (copy the whole file incl. BEGIN/END lines)"; exit 1; }
          if ! ssh -o BatchMode=yes "$USER_NAME@$HOST" 'echo "SSH login OK as $(whoami) on $(hostname)"'; then
            echo "--- details ---"
            ssh -v -o BatchMode=yes "$USER_NAME@$HOST" true 2>&1 | grep -E "Connecting to|Server accepts|Offering public key|Authentications that can continue|Permission denied" || true
            echo "::error::The server refused this key for user '$USER_NAME'. Add ~/.ssh/biw_deploy.pub to ~/.ssh/authorized_keys of exactly that user on the server."
            exit 1
          fi

      - name: Upload setup bundle
        run: |
          mkdir -p bundle && cp -r deploy server scripts/server/setup-staging.sh bundle/ && rm -rf bundle/server/node_modules
          tar czf bundle.tgz -C bundle .
          scp bundle.tgz "$USER_NAME@$HOST:/tmp/biw-setup.tgz"

      - name: Run setup on the server
        # root runs it directly; another user runs it with sudo (passwordless, or the STAGING_PASSWORD secret)
        run: |
          ssh "$USER_NAME@$HOST" \
            "set -e; rm -rf /tmp/biw-setup && mkdir -p /tmp/biw-setup && tar xzf /tmp/biw-setup.tgz -C /tmp/biw-setup && rm /tmp/biw-setup.tgz; \
             if [ \"\$(id -u)\" = 0 ]; then DEPLOY_USER=$USER_NAME bash /tmp/biw-setup/setup-staging.sh; \
             elif sudo -n true 2>/dev/null; then sudo env DEPLOY_USER=$USER_NAME bash /tmp/biw-setup/setup-staging.sh; \
             else sudo -S -p '' env DEPLOY_USER=$USER_NAME bash /tmp/biw-setup/setup-staging.sh; fi; \
             rm -rf /tmp/biw-setup" <<< "$SUDO_PASS"
