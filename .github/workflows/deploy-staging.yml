# Deploy to the staging server (https://bakedinweston.g-web.group).
# Runs on push to the work branch, or by hand: Actions -> "Deploy staging" -> Run workflow.
#
# Repository secrets (Settings -> Secrets and variables -> Actions):
#   STAGING_HOST     server IP or name (e.g. horpyna.g-web.group)
#   STAGING_USER     SSH user with write access to /var/www/bakedinweston and /opt/bakedinweston-contact
#   STAGING_PASSWORD SSH password of that user
#   STAGING_SSH_KEY  (optional, instead of the password) private key; public key in ~/.ssh/authorized_keys
name: Deploy staging

on:
  workflow_dispatch:
    inputs:
      what:
        description: 'site = site only; all = site + contact form service'
        default: site
        type: choice
        options: [site, all]
  push:
    branches: [claude/lucid-carson-g9ve5m]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: SSH login
        env:
          KEY: ${{ secrets.STAGING_SSH_KEY }}
          PASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          install -m 700 -d ~/.ssh
          printf 'Host *\n  StrictHostKeyChecking accept-new\n' > ~/.ssh/config
          if [ -n "$KEY" ]; then
            printf '%s\n' "$KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
            printf '  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n' >> ~/.ssh/config
          elif [ -n "$PASS" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          fi

      - name: Build and deploy
        env:
          DEPLOY_HOST: ${{ secrets.STAGING_HOST }}
          DEPLOY_USER: ${{ secrets.STAGING_USER }}
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
          HAS_KEY: ${{ secrets.STAGING_SSH_KEY != '' }}
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "::notice::STAGING_HOST secret is not set yet - skipping deploy"
            exit 0
          fi
          if [ "$HAS_KEY" != "true" ]; then export SSH_WRAP="sshpass -e"; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.what }}" = "all" ]; then
            ./scripts/deploy.sh
          else
            ./scripts/deploy.sh --site
          fi
