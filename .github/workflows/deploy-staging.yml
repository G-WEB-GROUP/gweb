# Deploy to the staging server (https://bakedinweston.g-web.group).
# Runs on push to the work branch, or by hand: Actions -> "Deploy staging" -> Run workflow.
#
# Repository secrets (Settings -> Secrets and variables -> Actions):
#   STAGING_HOST     server IP or name (e.g. horpyna.g-web.group)
#   STAGING_USER     SSH user with write access to /var/www/bakedinweston and /opt/bakedinweston-contact
#   STAGING_SSH_KEY  private key for that user (the public key goes to ~/.ssh/authorized_keys on the server)
name: Deploy staging

on:
  workflow_dispatch:
    inputs:
      what:
        description: 'site = site only; all = site + contact form service'
        default: site
        type: choice
        options: [site, all]
  push:
    branches: [claude/lucid-carson-g9ve5m]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: SSH key
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf 'Host *\n  IdentityFile ~/.ssh/id_deploy\n  StrictHostKeyChecking accept-new\n' > ~/.ssh/config

      - name: Build and deploy
        env:
          DEPLOY_HOST: ${{ secrets.STAGING_HOST }}
          DEPLOY_USER: ${{ secrets.STAGING_USER }}
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "::notice::STAGING_HOST secret is not set yet - skipping deploy"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.what }}" = "all" ]; then
            ./scripts/deploy.sh
          else
            ./scripts/deploy.sh --site
          fi
